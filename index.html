<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Faturamento</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white flex h-screen overflow-hidden">

    <!-- TELA DE LOGIN (Mostrada se não estiver autenticado) -->
    <div id="auth-screen" class="fixed inset-0 bg-gray-900 flex items-center justify-center z-50">
        <div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-96 border border-gray-700">
            <h2 class="text-2xl font-bold mb-6 text-center text-blue-400">🔒 Acesso Restrito</h2>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">E-mail</label>
                    <input type="email" id="email" required class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">Senha</label>
                    <input type="password" id="password" required class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition duration-200">
                    Entrar no Painel
                </button>
                <p id="error-msg" class="text-red-400 text-sm text-center mt-2 hidden"></p>
            </form>
        </div>
    </div>

    <!-- MENU LATERAL (Painel Principal) -->
    <aside class="w-64 bg-gray-800 border-r border-gray-700 flex flex-col justify-between">
        <div>
            <div class="p-5 border-b border-gray-700">
                <h1 class="text-xl font-bold text-blue-400">📊 Faturamento</h1>
            </div>
            <nav class="p-4 space-y-2">
                <button onclick="switchTab('dashboard')" id="btn-dashboard" class="w-full text-left px-4 py-2.5 rounded-lg bg-blue-600 text-white font-medium transition">🏠 Dashboard</button>
                <button onclick="switchTab('andre')" id="btn-andre" class="w-full text-left px-4 py-2.5 rounded-lg hover:bg-gray-700 text-gray-300 transition">📁 FAT ANDRÉ</button>
                <button onclick="switchTab('eduarda')" id="btn-eduarda" class="w-full text-left px-4 py-2.5 rounded-lg hover:bg-gray-700 text-gray-300 transition">📁 FAT EDUARDA</button>
            </nav>
        </div>
        <div class="p-4 border-t border-gray-700">
            <button onclick="logout()" class="w-full bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white py-2 rounded-lg transition font-medium text-sm">🚪 Sair</button>
        </div>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-1 p-8 overflow-y-auto">
        
        <!-- ABA: DASHBOARD -->
        <div id="tab-dashboard" class="space-y-6">
            <h2 class="text-2xl font-bold">Visão Geral</h2>
            <div class="bg-gradient-to-r from-blue-900 to-indigo-900 p-6 rounded-2xl border border-blue-700 shadow-lg">
                <p class="text-sm text-blue-200 uppercase tracking-wider font-semibold">Faturamento Total Combinado</p>
                <p id="total-geral" class="text-4xl font-extrabold mt-2">R$ 0,00</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-gray-800 p-6 rounded-xl border border-gray-700">
                    <p class="text-sm text-gray-400 uppercase tracking-wider font-semibold">FAT ANDRÉ</p>
                    <p id="total-andre" class="text-2xl font-bold mt-2 text-emerald-400">R$ 0,00</p>
                </div>
                <div class="bg-gray-800 p-6 rounded-xl border border-gray-700">
                    <p class="text-sm text-gray-400 uppercase tracking-wider font-semibold">FAT EDUARDA</p>
                    <p id="total-eduarda" class="text-2xl font-bold mt-2 text-purple-400">R$ 0,00</p>
                </div>
            </div>
        </div>

        <!-- ABA: FAT ANDRÉ -->
        <div id="tab-andre" class="hidden space-y-6">
            <h2 class="text-2xl font-bold text-emerald-400">Gestão - FAT ANDRÉ</h2>
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 max-w-xl">
                <h3 class="text-lg font-semibold mb-4">Adicionar Faturamento do Mês</h3>
                <form id="form-andre" class="space-y-4">
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Mês / Ano (Ex: Janeiro/2026)</label>
                        <input type="text" id="mes-andre" required class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Faturamento Bruto (R$)</label>
                        <input type="number" step="0.01" id="bruto-andre" required class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Lucro (R$)</label>
                        <input type="number" step="0.01" id="lucro-andre" required class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg">
                    </div>
                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 px-4 py-2 rounded-lg font-medium transition">Salvar Registro</button>
                </form>
            </div>
        </div>

        <!-- ABA: FAT EDUARDA -->
        <div id="tab-eduarda" class="hidden space-y-6">
            <h2 class="text-2xl font-bold text-purple-400">Gestão - FAT EDUARDA</h2>
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 max-w-xl">
                <h3 class="text-lg font-semibold mb-4">Adicionar Faturamento do Mês</h3>
                <form id="form-eduarda" class="space-y-4">
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Mês / Ano (Ex: Janeiro/2026)</label>
                        <input type="text" id="mes-eduarda" required class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Faturamento Bruto (R$)</label>
                        <input type="number" step="0.01" id="bruto-eduarda" required class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Lucro (R$)</label>
                        <input type="number" step="0.01" id="lucro-eduarda" required class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg">
                    </div>
                    <button type="submit" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg font-medium transition">Salvar Registro</button>
                </form>
            </div>
        </div>

    </main>

    <!-- SCRIPT CENTRALIZADO COM DIAGNÓSTICO -->
    <script>
        const SUPABASE_URL = 'https://moeatmaurbmblfpqwcok.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vZWF0bWF1cmJtYmxmcHF3Y29rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NDE2OTUsImV4cCI6MjEwNjUxNzY5NX0.iOR5Ejz561Kw7AvIpddza30FL2eTIPlebvVIgsI0q0g';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const authScreen = document.getElementById('auth-screen');

        // Verifica sessão ao carregar
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                authScreen.classList.add('hidden');
                carregarTotais();
            } else {
                authScreen.classList.remove('hidden');
            }
        }
        checkSession();

        // Lógica de Login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            errorMsg.classList.add('hidden');

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                alert("Erro ao entrar: " + error.message);
                errorMsg.textContent = error.message;
                errorMsg.classList.remove('hidden');
            } else {
                alert("Login efetuado com sucesso!");
                authScreen.classList.add('hidden');
                carregarTotais();
            }
        });

        // Logout
        async function logout() {
            await supabase.auth.signOut();
            authScreen.classList.remove('hidden');
        }

        // Navegação entre abas
        function switchTab(tab) {
            document.getElementById('tab-dashboard').classList.add('hidden');
            document.getElementById('tab-andre').classList.add('hidden');
            document.getElementById('tab-eduarda').classList.add('hidden');

            document.getElementById('btn-dashboard').className = "w-full text-left px-4 py-2.5 rounded-lg hover:bg-gray-700 text-gray-300 transition";
            document.getElementById('btn-andre').className = "w-full text-left px-4 py-2.5 rounded-lg hover:bg-gray-700 text-gray-300 transition";
            document.getElementById('btn-eduarda').className = "w-full text-left px-4 py-2.5 rounded-lg hover:bg-gray-700 text-gray-300 transition";

            if (tab === 'dashboard') {
                document.getElementById('tab-dashboard').classList.remove('hidden');
                document.getElementById('btn-dashboard').className = "w-full text-left px-4 py-2.5 rounded-lg bg-blue-600 text-white font-medium transition";
                carregarTotais();
            } else if (tab === 'andre') {
                document.getElementById('tab-andre').classList.remove('hidden');
                document.getElementById('btn-andre').className = "w-full text-left px-4 py-2.5 rounded-lg bg-emerald-600 text-white font-medium transition";
            } else if (tab === 'eduarda') {
                document.getElementById('tab-eduarda').classList.remove('hidden');
                document.getElementById('btn-eduarda').className = "w-full text-left px-4 py-2.5 rounded-lg bg-purple-600 text-white font-medium transition";
            }
        }

        // Salvar André
        document.getElementById('form-andre').addEventListener('submit', async (e) => {
            e.preventDefault();
            const mes = document.getElementById('mes-andre').value;
            const bruto = parseFloat(document.getElementById('bruto-andre').value);
            const lucro = parseFloat(document.getElementById('lucro-andre').value);

            const { error } = await supabase.from('faturamento').insert([{ conta: 'andre', mes, bruto, lucro }]);
            if (error) alert('Erro ao salvar: ' + error.message);
            else {
                alert('Salvo com sucesso!');
                document.getElementById('form-andre').reset();
                carregarTotais();
            }
        });

        // Salvar Eduarda
        document.getElementById('form-eduarda').addEventListener('submit', async (e) => {
            e.preventDefault();
            const mes = document.getElementById('mes-eduarda').value;
            const bruto = parseFloat(document.getElementById('bruto-eduarda').value);
            const lucro = parseFloat(document.getElementById('lucro-eduarda').value);

            const { error } = await supabase.from('faturamento').insert([{ conta: 'eduarda', mes, bruto, lucro }]);
            if (error) alert('Erro ao salvar: ' + error.message);
            else {
                alert('Salvo com sucesso!');
                document.getElementById('form-eduarda').reset();
                carregarTotais();
            }
        });

        // Carregar Totais
        async function carregarTotais() {
            const { data, error } = await supabase.from('faturamento').select('*');
            if (error) return;

            let totalAndre = 0;
            let totalEduarda = 0;

            data.forEach(item => {
                if (item.conta === 'andre') totalAndre += Number(item.bruto);
                if (item.conta === 'eduarda') totalEduarda += Number(item.bruto);
            });

            const totalGeral = totalAndre + totalEduarda;

            document.getElementById('total-andre').textContent = `R$ ${totalAndre.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
            document.getElementById('total-eduarda').textContent = `R$ ${totalEduarda.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
            document.getElementById('total-geral').textContent = `R$ ${totalGeral.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
        }
    </script>
</body>
</html>
